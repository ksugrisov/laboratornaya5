{% load static %}
<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Архив рекламных роликов</title>
    <link rel="stylesheet" href="{% static 'css/article.css' %}">
</head>
<body class="archive-page">
    <div class="header">
        <img src="{% static 'img/logo.png' %}" />
    </div>
    <div class="archive">
        {% for post in posts %}
        <div class="one-post">
            <h2 class="post-title"><a href="{% url 'get_advert' post.id %}">{{ post.title }}</a></h2>
            <div class="article-info">
                <div class="article-author">Заказчик: {{ post.customer }}</div>
                <div class="article-created-date">{{ post.air_date }}</div>
            </div>
            <p class="article-details">Передача: {{ post.program }}. Длительность: {{ post.duration }} сек. Стоимость рекламы: {{ post.get_cost }} руб.</p>
            <p class="article-text">{{ post.get_excerpt }}</p>
        </div>
        {% endfor %}
    </div>
</body>
</html>
