{% load static %}
<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Добавить рекламный ролик</title>
    <link rel="stylesheet" href="{% static 'css/article.css' %}">
    <link rel="stylesheet" href="{% static 'css/form.css' %}">
</head>
<body>
    <div class="content">
        <h1>Добавить рекламный ролик</h1>
        <p class="errors">{{ form.errors }}</p>
        <form method="POST">{% csrf_token %}
            <div class="field">
                <label>Название ролика</label>
                <input type="text" name="title" placeholder="Название ролика" value="{{ form.title }}">
            </div>
            <div class="field">
                <label>Заказчик</label>
                <input type="text" name="customer" placeholder="Заказчик" value="{{ form.customer }}">
            </div>
            <div class="field">
                <label>Передача</label>
                <input type="text" name="program" placeholder="Передача" value="{{ form.program }}">
            </div>
            <div class="field">
                <label>Рейтинг передачи</label>
                <input type="number" step="0.01" name="rating" placeholder="Рейтинг передачи" value="{{ form.rating }}">
            </div>
            <div class="field">
                <label>Дата эфира</label>
                <input type="date" name="air_date" value="{{ form.air_date }}">
            </div>
            <div class="field">
                <label>Длительность, сек</label>
                <input type="number" name="duration" placeholder="Длительность, сек" value="{{ form.duration }}">
            </div>
            <div class="field">
                <label>Стоимость минуты, руб.</label>
                <input type="number" step="0.01" name="minute_price" placeholder="Стоимость минуты, руб." value="{{ form.minute_price }}">
            </div>
            <div class="field">
                <label>Агент</label>
                <input type="text" name="agent" placeholder="Агент" value="{{ form.agent }}">
            </div>
            <div class="field">
                <label>Процент агента, %</label>
                <input type="number" step="0.01" name="agent_percent" placeholder="Процент агента, %" value="{{ form.agent_percent }}">
            </div>
            <div class="field wide">
                <label>Сведения о заказчике</label>
                <textarea name="text" placeholder="Сведения о заказчике">{{ form.text }}</textarea>
            </div>
            <div class="field wide">
                <input type="submit" value="Сохранить">
            </div>
        </form>
    </div>
</body>
</html>
